<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NX Generator Tools</title>
    <meta property="og:title" content="NX Generator Helper Tools" />
    <meta
      property="og:description"
      content="Dashboard generator konten digital signage untuk Public, MBG, dan School. Download sample content dan generate JSON dengan mudah."
    />
    <meta property="og:image" content="thumbnail-nexu.jpg" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="http://nx.pilkupil.my.id/" />
    <meta name="theme-color" content="#0f172a" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/ico" href="favicon.ico" />

    <style>
      :root {
        /* Warna Brand (Sesuai Logo) */
        --brand-red: #ef4444;
        --brand-green: #10b981;
        --brand-blue: #3b82f6;

        /* Modern Dark Theme Palette */
        --bg-body: #0f172a; /* Slate 900 */
        --bg-sidebar: #1e293b; /* Slate 800 */
        --bg-card: #1e293b;
        --bg-hover: #334155;
        --bg-active: rgba(59, 130, 246, 0.15);

        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg-body);
        color: var(--text-main);
        font-family: "Inter", sans-serif;
        margin: 0;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* --- 1. SIDEBAR --- */
      .sidebar {
        width: 300px;
        background-color: var(--bg-sidebar);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }

      .brand-area {
        padding: 25px;
        border-bottom: 1px solid var(--border-color);
        text-align: center;
      }

      .brand-title {
        font-size: 1.5rem;
        font-weight: 800;
        background: linear-gradient(
          to right,
          var(--brand-red),
          var(--brand-blue),
          var(--brand-green)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0;
      }

      .menu-list {
        list-style: none;
        padding: 20px 15px;
        margin: 0;
        overflow-y: auto;
        flex-grow: 1;
      }

      .menu-item {
        margin-bottom: 8px;
      }

      .menu-btn {
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: var(--text-muted);
        padding: 14px 16px;
        border-radius: 10px;
        cursor: pointer;
        font-family: inherit;
        font-weight: 600;
        font-size: 0.9rem;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        line-height: 1.4;
      }

      .menu-btn:hover {
        background-color: var(--bg-hover);
        color: var(--text-main);
      }

      /* State Aktif (Menu yang sedang dipilih) */
      .menu-btn.active {
        background-color: var(--bg-active);
        color: var(--brand-blue);
        border: 1px solid rgba(59, 130, 246, 0.2);
      }

      /* --- 2. MAIN CONTENT AREA --- */
      .main-content {
        flex-grow: 1;
        padding: 40px;
        overflow-y: auto;
        position: relative;
      }

      /* Container Section */
      .content-section {
        display: none; /* Sembunyikan semua section secara default */
        animation: fadeIn 0.4s ease;
      }

      .content-section.active {
        display: block; /* Tampilkan hanya yang aktif */
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .section-header {
        margin-bottom: 30px;
        padding-bottom: 15px;
        border-bottom: 1px solid var(--border-color);
      }

      .section-title {
        font-size: 1.8rem;
        font-weight: 700;
        margin: 0;
        color: var(--text-main);
      }

      /* GRID KARTU */
      .link-grid {
        display: grid;
        /* grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); */
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .link-item {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        position: relative;
        overflow: hidden;
        transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      }

      .link-item:hover {
        transform: translateY(-5px);
        border-color: var(--brand-blue);
        box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.6);
      }

      /* Garis Gradasi di atas kartu */
      .link-item::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(
          90deg,
          var(--brand-red),
          var(--brand-green),
          var(--brand-blue)
        );
        opacity: 0.8;
      }

      .link-content {
        display: flex;
        padding: 25px;
        text-decoration: none;
        color: inherit;
        height: 100%;
        align-items: flex-start;
      }

      .link-icon {
        width: 32px;
        height: 32px;
        margin-right: 15px;
        fill: var(--text-muted);
        flex-shrink: 0;
        transition: fill 0.2s;
      }

      .link-item:hover .link-icon {
        fill: var(--brand-blue);
      }

      .link-info {
        display: flex;
        flex-direction: column;
      }
      .link-title {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 6px;
        color: var(--text-main);
      }
      .link-desc {
        font-size: 0.85rem;
        color: var(--text-muted);
        line-height: 1.5;
      }

      /* Responsive Mobile */
      @media (max-width: 800px) {
        body {
          flex-direction: column;
          overflow: auto;
        }
        .sidebar {
          width: 100%;
          height: auto;
          border-right: none;
          border-bottom: 1px solid var(--border-color);
        }
        .menu-list {
          display: flex;
          overflow-x: auto;
          padding: 10px;
          white-space: nowrap;
        }
        .menu-item {
          margin-bottom: 0;
          margin-right: 10px;
        }
        .main-content {
          padding: 20px;
          overflow: visible;
        }
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand-area">
        <h1 class="brand-title">NX Generator Tools</h1>
      </div>
      <ul class="menu-list" id="sidebar-menu"></ul>
    </aside>

    <main class="main-content" id="main-container"></main>

    <script>
      // Fungsi untuk membuat ID yang aman dari Judul yang mengandung Spasi/Emoji
      // Contoh: "🛠️ Generator Public" -> "generator-public"
      function createSafeId(str) {
        return str
          .toLowerCase()
          .replace(/[^\w\s-]/g, "") // Hapus emoji & karakter aneh
          .trim()
          .replace(/\s+/g, "-"); // Ganti spasi dengan strip
      }

      function renderDashboard(data) {
        const sidebarMenu = document.getElementById("sidebar-menu");
        const mainContainer = document.getElementById("main-container");

        sidebarMenu.innerHTML = "";
        mainContainer.innerHTML = "";

        data.forEach((group, index) => {
          // 1. Buat ID Unik untuk setiap kategori
          // Jika generate gagal (string kosong), pakai index sebagai fallback
          const sectionId = createSafeId(group.groupTitle) || `group-${index}`;

          // 2. Buat Menu Sidebar
          const li = document.createElement("li");
          li.className = "menu-item";

          const btn = document.createElement("button");
          btn.className = `menu-btn ${index === 0 ? "active" : ""}`; // Menu pertama otomatis aktif
          btn.textContent = group.groupTitle; // Tetap tampilkan Emoji aslinya di teks

          // Event Klik Sidebar
          btn.onclick = () => {
            // Reset semua active
            document
              .querySelectorAll(".menu-btn")
              .forEach((b) => b.classList.remove("active"));
            document
              .querySelectorAll(".content-section")
              .forEach((s) => s.classList.remove("active"));

            // Set active yang diklik
            btn.classList.add("active");
            document.getElementById(sectionId).classList.add("active");
          };

          li.appendChild(btn);
          sidebarMenu.appendChild(li);

          // 3. Buat Konten Section
          const section = document.createElement("div");
          section.className = `content-section ${index === 0 ? "active" : ""}`;
          section.id = sectionId;

          // Header Kategori
          const header = document.createElement("div");
          header.className = "section-header";
          const h2 = document.createElement("h2");
          h2.className = "section-title";
          h2.textContent = group.groupTitle;
          header.appendChild(h2);
          section.appendChild(header);

          // Grid Kartu
          const ul = document.createElement("ul");
          ul.className = "link-grid";

          group.links.forEach((link) => {
            const card = document.createElement("li");
            card.className = "link-item";
            card.innerHTML = `
                        <a href="${link.url}" class="link-content" target="_blank">
                            <svg class="link-icon" viewBox="0 0 24 24"><path d="${link.svgPath}"></path></svg>
                            <div class="link-info">
                                <span class="link-title">${link.title}</span>
                                <span class="link-desc">${link.description}</span>
                            </div>
                        </a>
                    `;
            ul.appendChild(card);
          });

          section.appendChild(ul);
          mainContainer.appendChild(section);
        });
      }

      // --- LOAD DATA JSON DARI FILE EKSTERNAL ---
      fetch("links.json")
        .then((response) => {
          if (!response.ok) {
            throw new Error(
              "Gagal load links.json. Pastikan file ada di folder yang sama."
            );
          }
          return response.json();
        })
        .then((data) => {
          // Render data setelah berhasil diambil
          renderDashboard(data);
        })
        .catch((error) => {
          console.error(error);
          document.getElementById(
            "main-container"
          ).innerHTML = `<div style="text-align:center; padding: 50px;">
                        <h3 style="color: var(--brand-red);">Gagal Memuat Data</h3>
                        <p style="color: var(--text-muted);">${error.message}</p>
                    </div>`;
        });
    </script>
  </body>
</html>
