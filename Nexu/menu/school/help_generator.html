<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Data Fasilitas Baru - JSON Output</title>
    <link rel="icon" type="image/ico" href="../favicon.ico" />
    <link rel="stylesheet" href="../../style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Generator JSON Bantuan 🛠️ (Download Added)</h1>
      <p>Isi formulir, klik **Generate JSON**, lalu klik **Download JSON**.</p>

      <div id="facility-container"></div>

      <div style="margin-top: 20px">
        <button class="btn-success" onclick="addFacility()">
          Tambah Fasilitas Baru
        </button>
        <button class="btn-success" onclick="generateJson()">
          Generate JSON
        </button>
        <button
          class="btn-download"
          onclick="downloadJson()"
          id="download-button"
          disabled
        >
          ⬇️ Download JSON
        </button>
      </div>

      <hr />

      <h2>Hasil JSON</h2>
      <pre id="json-output">Tekan 'Generate JSON' untuk melihat hasilnya.</pre>
    </div>

    <script>
      let facilityCounter = 0;
      let globalImageIdCounter = 1;
      let facilityData = {};
      let lastGeneratedJson = null; // Menyimpan JSON terakhir yang dibuat

      // Data awal untuk fasilitas pertama (berdasarkan contoh Anda)
      const initialFacility = {
        id: 1,
        company_id: 1,
        type: "Hari Ini",
        title: "Executive Lounge",
        description:
          "A quiet and elegant space designed for VIP guests or premium patients, offering a relaxing atmosphere, refreshments, and workspace amenities. Ideal for meetings, casual gatherings, or quiet reading.",
        status: "ACTIVE",
        qr_code_url: "",
        contents: [
          {
            id: 1,
            filename: "fc_meeting_room_1.webp",
            mime_type: "image/webp",
            extension: "webp",
            sizebytes: 93,
            url: "/media/fc_meeting_room_1.webp",
          },
          {
            id: 2,
            filename: "fc_meeting_room_2.webp",
            mime_type: "image/jpeg",
            extension: "jpg",
            sizebytes: 121,
            url: "/media/fc_meeting_room_2.webp",
          },
        ],
      };

      // Inisialisasi data dan counter
      facilityData[1] = initialFacility;
      facilityCounter = 1;
      globalImageIdCounter = 3;

      // Fungsi untuk merender HTML dari data fasilitas
      function renderFacilityForm(id, data) {
        const container = document.getElementById("facility-container");
        const existingElement = document.getElementById(`facility-${id}`);

        const facilityHtml = `
            <div class="facility-form" id="facility-${id}">
                ${id > 1 ? "<hr/>" : ""}
                <h3>Detail Fasilitas ID: ${data.id}</h3>
                
                <label for="id-data-${id}">ID Fasilitas (Final JSON):</label>
                <input type="number" class="facility-id" id="id-data-${id}" value="${
          data.id
        }" min="1" required>

                <label for="title-${id}">Judul Hari Ini (title):</label>
                <input type="text" class="facility-title" id="title-${id}" value="${
          data.title
        }" required>

                <label for="description-${id}">Deskripsi (description):</label>
                <textarea class="facility-description" id="description-${id}" rows="3" required>${
          data.description
        }</textarea>

                <label for="status-${id}">Status:</label>
                <select class="facility-status" id="status-${id}" required>
                    <option value="ACTIVE" ${
                      data.status === "ACTIVE" ? "selected" : ""
                    }>ACTIVE</option>
                    <option value="INACTIVE" ${
                      data.status === "INACTIVE" ? "selected" : ""
                    }>INACTIVE</option>
                </select>

                <label for="qr_code_url-${id}">QR Code URL (Opsional):</label>
                <input type="text" class="facility-qr-code" id="qr_code_url-${id}" placeholder="https://..." value="${
          data.qr_code_url
        }">

                <div class="image-uploader">
                     <h4>Upload Media (Ambil Nama File Gambar & Video MP4)</h4>
                    <input type="file" multiple accept="image/*" onchange="handleFileSelect(this, ${id})">
                    <div class="image-list" id="image-list-${id}">
                        </div>
                </div>
                ${
                  Object.keys(facilityData).length > 1 || id > 1
                    ? `<button class="btn-danger btn-remove-facility" onclick="removeFacility(${id})">Hapus Fasilitas</button>`
                    : ""
                }
            </div>
        `;

        if (existingElement) {
          existingElement.outerHTML = facilityHtml;
        } else {
          container.insertAdjacentHTML("beforeend", facilityHtml);
        }

        renderImageList(id);
      }

      function addFacility() {
        facilityCounter++;
        const newId = facilityCounter;
        const newJsonId = facilityCounter > 1 ? facilityCounter : 2;

        facilityData[newId] = {
          id: newJsonId,
          company_id: 1,
          type: "Hari Ini",
          title: "",
          description: "",
          status: "ACTIVE",
          qr_code_url: "",
          contents: [],
        };
        renderFacilityForm(newId, facilityData[newId]);
      }

      function removeFacility(id) {
        if (Object.keys(facilityData).length <= 1) {
          alert("Tidak bisa menghapus fasilitas terakhir.");
          return;
        }

        const element = document.getElementById(`facility-${id}`);
        if (element) {
          element.remove();
          delete facilityData[id];
          Object.keys(facilityData).forEach((key) =>
            renderFacilityForm(parseInt(key), facilityData[parseInt(key)])
          );
        }
      }

      function handleFileSelect(inputElement, facilityId) {
        const files = inputElement.files;
        if (files.length === 0) return;

        const newContents = [];
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const fileName = file.name;
          const fileExtension = fileName.split(".").pop().toLowerCase();

          // Logika deteksi Mime Type untuk MP4 dan Gambar
          let mimeType = file.type;
          if (!mimeType) {
            mimeType =
              fileExtension === "mp4" ? "video/mp4" : `image/${fileExtension}`;
          }

          newContents.push({
            id: globalImageIdCounter++,
            filename: fileName,
            mime_type: mimeType,
            extension: fileExtension,
            sizebytes: file.size,
            url: `/media/${fileName}`,
          });
        }

        facilityData[facilityId].contents.push(...newContents);
        inputElement.value = "";
        renderImageList(facilityId);
      }

      function renderImageList(facilityId) {
        const listElement = document.getElementById(`image-list-${facilityId}`);
        if (!listElement) return;
        listElement.innerHTML = "";

        if (
          !facilityData[facilityId] ||
          facilityData[facilityId].contents.length === 0
        ) {
          listElement.innerHTML =
            "<div>Belum ada media yang ditambahkan.</div>";
          return;
        }

        facilityData[facilityId].contents.forEach((content) => {
          const isVideo = content.mime_type.includes("video");
          const icon = isVideo ? "🎥" : "🖼️";
          const div = document.createElement("div");
          div.style.marginBottom = "5px";
          div.innerHTML = `
                <span>${icon} <b>${content.filename}</b> (Type: ${content.mime_type})</span>
                <button class="btn-danger" style="padding: 2px 8px; margin-left:10px;" onclick="removeImage(${facilityId}, ${content.id})">x</button>
            `;
          listElement.appendChild(div);
        });
      }

      function removeImage(facilityId, contentId) {
        facilityData[facilityId].contents = facilityData[
          facilityId
        ].contents.filter((content) => content.id !== contentId);
        renderImageList(facilityId);
      }

      // Fungsi utama untuk menggenerasi JSON
      function generateJson() {
        const facilityArray = [];

        Object.keys(facilityData).forEach((key) => {
          const id = parseInt(key);
          const titleElement = document.getElementById(`title-${id}`);
          const descElement = document.getElementById(`description-${id}`);
          const statusElement = document.getElementById(`status-${id}`);
          const qrCodeElement = document.getElementById(`qr_code_url-${id}`);
          const idDataElement = document.getElementById(`id-data-${id}`);

          if (titleElement && descElement && statusElement && idDataElement) {
            // Update data dari form ke facilityData
            facilityData[id].id = parseInt(idDataElement.value);
            facilityData[id].title = titleElement.value;
            facilityData[id].description = descElement.value;
            facilityData[id].status = statusElement.value;
            facilityData[id].qr_code_url = qrCodeElement.value;

            // Buat objek untuk JSON final
            const facility = {
              id: facilityData[id].id,
              company_id: 1,
              type: "Bantuan",
              title: facilityData[id].title,
              description: facilityData[id].description,
              status: facilityData[id].status,
              qr_code_url: facilityData[id].qr_code_url,
              created_at: new Date()
                .toISOString()
                .slice(0, 19)
                .replace("T", " "),
              updated_at: new Date()
                .toISOString()
                .slice(0, 19)
                .replace("T", " "),
              contents: facilityData[id].contents.map((content) => {
                // Hilangkan sizebytes dan extension/mime_type yang tidak ada di contoh awal Anda,
                // kecuali Anda ingin menyertakannya. Saya akan menyertakan yang lengkap.
                return content;
              }),
            };
            facilityArray.push(facility);
          }
        });

        const finalJson = {
          status: true,
          messageTitle: "",
          message: "Generated Bantuan Detail",
          data: facilityArray,
        };

        // Simpan JSON yang digenerate dan aktifkan tombol download
        lastGeneratedJson = finalJson;
        document.getElementById("json-output").textContent = JSON.stringify(
          finalJson,
          null,
          2
        );
        document.getElementById("download-button").disabled = false;
      }

      // FUNGSI BARU: Download JSON
      function downloadJson() {
        if (!lastGeneratedJson) {
          alert("Harap generate JSON terlebih dahulu!");
          return;
        }

        const jsonString = JSON.stringify(lastGeneratedJson, null, 2);
        const blob = new Blob([jsonString], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        // Buat elemen <a> sementara untuk memicu download
        const a = document.createElement("a");
        a.href = url;
        a.download = "help.json";

        // Simulasikan klik pada elemen <a>
        document.body.appendChild(a);
        a.click();

        // Bersihkan elemen <a> sementara dan URL blob
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      // Inisialisasi: Panggil renderFacilityForm untuk data awal
      document.addEventListener("DOMContentLoaded", () => {
        renderFacilityForm(1, initialFacility);
      });
    </script>
  </body>
</html>
